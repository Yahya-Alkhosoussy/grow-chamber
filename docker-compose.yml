services:
  backend:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build: ./Backend
    networks:
      - backend
  image_processing:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build: ./ImageProcessing
    networks:
      - backend
  frontend:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build: ./Frontend
    ports:
      - "5000:5000"
    networks:
      - backend
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secure_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - backend
 
networks:
  backend:
    driver: bridge

volumes:
  rabbitmq_data:
  rabbitmq_log: